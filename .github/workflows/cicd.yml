name: Build and Test App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/src/backend
  FRONTEND_IMAGE: ${{ github.repository }}/src/frontend

jobs:
  # ----------------------------------
  # CI: Run backend and frontend tests
  # ----------------------------------
  cibackend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: python3 -m pip install -r src/backend/requirements_test.txt
    - name: Lint check with ruff
      run: |
        ruff check
        ruff format --check
    - name: Run tests with pytest
      run: pytest --full-trace -v

  cifrontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        cache-dependency-path: ./src/frontend/package-lock.json
        node-version: 24.14.1
        cache: 'npm'
    - name: Install and build the application      
      run: |
        npm ci
        npm run build
      working-directory: ./src/frontend
    - name: Run tests
      run: npm run test
      working-directory: ./src/frontend

  # -----------------------
  # CD: Build Docker images
  # -----------------------
  cdfrontend:
    needs: cifrontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend # Path to your frontend directory
          file: ./src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  cdbackend:
    needs: cibackend    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend # Path to your backend directory
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}