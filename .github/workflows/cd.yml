name: Build and Test App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/src/backend
  FRONTEND_IMAGE: ${{ github.repository }}/src/frontend

jobs:
  # -----------------------------------------------------------------
  # Job 1: Build Frontend Docker Image
  # -----------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prepare frontend
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache-dependency-path: ./src/frontend/package-lock.json
          node-version: 24.14.1
          cache: 'npm'
      - name: Install and build the application      
        run: |
          npm ci
          npm run build
        working-directory: ./src/frontend
      - name: Run tests
        run: npm run test
        working-directory: ./src/frontend
      # Ended prepare frontend

      - name: Extract metadata (tags, labels) for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend # Path to your frontend directory
          file: ./src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------
  # Job 2: Build Backend Docker Image
  # -----------------------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prepare backend
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python3 -m pip install -r src/backend/requirements_test.txt
      - name: Lint check with ruff
        run: |
          ruff check
          ruff format --check
      - name: Run tests with pytest
        run: pytest --full-trace -v
      # Ended prepare backend

      - name: Extract metadata (tags, labels) for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend # Path to your backend directory
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------
  # Job 3: Run docker-compose with built images
  # -----------------------------------------------------------------
  run-compose:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tags Environment Variables
        run: |
          # Calculate short commit SHA to match the tag pushed in previous jobs
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "BACKEND_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:sha-${SHORT_SHA}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:sha-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Pull Docker Images
        run: |
          docker pull $BACKEND_IMAGE_TAG
          docker pull $FRONTEND_IMAGE_TAG

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: Verify running containers
        run: docker compose ps